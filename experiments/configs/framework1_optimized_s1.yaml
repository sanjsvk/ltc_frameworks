# Framework 1 — S1 Optimized Parameters
# Expanded grids for better parameter selection vs frozen narrow grids

geo_adstock:
  decay_grid:
    # Frozen: [0.55, 0.70, 0.85, 0.90] → Optimized: Full range [0.10-0.95]
    tv:      [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
    search:  [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
    social:  [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
    display: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
    video:   [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  feature: impressions
  channels: [tv, search, social, display, video]
  fit_intercept: true
  selection_metric: aic

weibull_adstock:
  max_lag: 52
  feature: impressions
  channels: [tv, search, social, display, video]
  max_lag_override:
    tv:      52
    search:  8      # Frozen: 6 → Optimized: 8 (allow slightly longer lag)
    social:  26
    display: 16     # Frozen: 12 → Optimized: 16
    video:   52
  shape_bounds:
    tv:      [0.5, 3.0]      # Frozen: [0.8, 2.0] → Optimized: wider
    search:  [0.5, 2.5]       # Frozen: [0.8, 1.5] → Optimized: wider
    social:  [0.5, 3.0]       # Frozen: [0.8, 2.0] → Optimized: wider
    display: [0.5, 2.5]       # Frozen: [0.8, 1.8] → Optimized: wider
    video:   [0.5, 3.0]       # Frozen: [0.8, 2.0] → Optimized: wider
  scale_bounds:
    tv:      [5.0, 20.0]      # Frozen: [6.0, 15.0] → Optimized: wider
    search:  [0.5, 5.0]        # Frozen: [1.0, 3.0] → Optimized: wider
    social:  [2.0, 10.0]       # Frozen: [3.0, 8.0] → Optimized: wider
    display: [1.0, 8.0]        # Frozen: [1.5, 5.0] → Optimized: wider
    video:   [4.0, 18.0]       # Frozen: [5.0, 14.0] → Optimized: wider

almon_pdl:
  stc_max_lag: 6
  stc_degree: 2        # Frozen: 2, keep
  ltc_degree: 3        # Frozen: 3, but test [2, 3, 4] in optimization
  stc_cutoff: 6
  feature: impressions
  channels: [tv, search, social, display, video]
  ltc_max_lag_override:
    tv:      52
    search:  8        # Frozen: 4 → Optimized: 8 (expand search lag)
    social:  26
    display: 16       # Frozen: 12 → Optimized: 16
    video:   52

dual_adstock:
  feature: impressions
  channels: [tv, search, social, display, video]
  enforce_ltc_gt_stc: true
  stc_decay_grid:
    # Frozen: [0.45, 0.50, 0.55, 0.60, 0.65] → Optimized: Wider
    tv:      [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
    search:  [0.10, 0.15, 0.20, 0.25, 0.30]
    social:  [0.30, 0.40, 0.50, 0.60, 0.70]
    display: [0.30, 0.40, 0.50, 0.60, 0.70]
    video:   [0.40, 0.50, 0.60, 0.70, 0.80]
  ltc_decay_grid:
    # Frozen: [0.82, 0.88, 0.90] for TV → Optimized: Wider
    tv:      [0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
    search:  [0.20, 0.25, 0.30, 0.35, 0.40]
    social:  [0.70, 0.75, 0.80, 0.85]
    display: [0.50, 0.60, 0.70]
    video:   [0.75, 0.80, 0.85, 0.90]
